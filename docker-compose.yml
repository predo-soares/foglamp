# Foglamp production stack for Coolify.
# Configure required variables in Coolify; never commit production secrets.
# Route web:3001, server:3000, ingest:4000 through the Coolify proxy.
# Run explicitly with: docker compose -f docker-compose.yml up --build

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://foglamp:${POSTGRES_PASSWORD:?}@postgres:5432/foglamp
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
  CORS_ORIGIN: ${CORS_ORIGIN:?}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  CLICKHOUSE_DATABASE: foglamp
  OPENROUTER_MODELS_URL: https://openrouter.ai/api/v1/models
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  AUTH_DISABLE_EMAIL_PASSWORD: ${AUTH_DISABLE_EMAIL_PASSWORD:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
  FOGLAMP_SECRETS_KEY: ${FOGLAMP_SECRETS_KEY:?}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foglamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: foglamp
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foglamp -d foglamp"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: foglamp
      # Without a USER/PASSWORD set on the server, the image locks the `default`
      # user to localhost only — which breaks the app tiers connecting over the
      # compose network (AUTHENTICATION_FAILED). SKIP_USER_SETUP keeps `default`
      # passwordless WITH network access, matching the empty CLICKHOUSE_PASSWORD
      # the apps use. ClickHouse is not published to the host, so it's reachable
      # only inside this network. To harden, set CLICKHOUSE_USER/PASSWORD here and
      # in x-app-env instead, and drop this line.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: Postgres migrate + ClickHouse DDL + retention + seed, then exits.
  # The app tiers wait for it to complete successfully.
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      target: server
    environment:
      <<: *app-env
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    build:
      context: .
      target: ingest
    environment:
      <<: *app-env
      INGEST_PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?}
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Baked into the client bundle (browser-facing); kept here for parity.
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?}
      # SSR session gate reaches the server over the internal network.
      INTERNAL_SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
  ch_data:
  redis_data:
