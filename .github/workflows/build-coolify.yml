name: Build Coolify images

on:
  push:
    branches: [deploy/coolify]
  workflow_dispatch:

concurrency:
  group: coolify-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    if: github.repository == 'predo-soares/foglamp'
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target: [migrate, server, ingest, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://foglamp-api.convivae.com
            NEXT_PUBLIC_APP_URL=https://foglamp.convivae.com

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable and convenience tags after every build passes
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          for target in migrate server ingest web; do
            image="$IMAGE_BASE-$target"
            docker buildx imagetools create \
              --tag "$image:$GITHUB_SHA" \
              --tag "$image:coolify" \
              "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
          done
          echo "Set FOGLAMP_IMAGE_TAG=$GITHUB_SHA in Coolify, then deploy." >> "$GITHUB_STEP_SUMMARY"
